name: Build tested release packages
on:
  push:
    tags: ['v*', 'panel-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/panel-test.yml
  package:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v2-${{ runner.os }}-release-${{ matrix.arch }}-${{ hashFiles('go.mod', 'go.sum', 'panel/backend/go.mod', 'panel/backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-release-${{ matrix.arch }}-${{ hashFiles('go.mod', 'go.sum', 'panel/backend/go.mod', 'panel/backend/go.sum') }}-
            go-v2-${{ runner.os }}-validation-${{ hashFiles('go.mod', 'go.sum', 'panel/backend/go.mod', 'panel/backend/go.sum') }}-
      - name: Download the frontend that passed validation
        uses: actions/download-artifact@v4
        with:
          name: validated-web
          path: panel/backend/cmd/panel/web
      - name: Compile the target binaries and package
        run: |
          test -f panel/backend/cmd/panel/web/index.html
          test -d panel/backend/cmd/panel/web/_next
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/ParsaKSH/spoof-tunnel/internal/l3.Version=$SPOOF_VERSION" -o dist/spoof-l3 ./cmd/spoof-l3
          (cd panel/backend && CGO_ENABLED=0 go build -trimpath -ldflags "-X main.panelVersion=$SPOOF_VERSION" -o ../../dist/spoof-panel ./cmd/panel)
          SPOOF_ARCH="$GOARCH" python3 scripts/package.py
        env:
          GOARCH: ${{ matrix.arch }}
          SPOOF_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/spoof-tunnel-linux-${{ matrix.arch }}.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: packages
          merge-multiple: true
      - run: cd packages && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: packages/*
