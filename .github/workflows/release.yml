name: Build tested release packages
on:
  push:
    tags: ['v*', 'panel-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/panel-test.yml
  package:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
      - run: bash scripts/build.sh
        env:
          GOARCH: ${{ matrix.arch }}
          SPOOF_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/spoof-tunnel-linux-${{ matrix.arch }}.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: packages
          merge-multiple: true
      - run: cd packages && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/*
